<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register | EduCore LMS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5048e5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-4">
<!-- Register Card Container -->
<div class="max-w-md w-full bg-white dark:bg-slate-900 shadow-xl rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Header / Logo Section -->
<div class="pt-8 px-8 flex flex-col items-center">
<div class="bg-primary/10 p-3 rounded-full mb-4">
<span class="material-symbols-outlined text-primary text-3xl">school</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-2xl font-bold tracking-tight">Create your account</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-2 text-center">Join EduCore LMS and start your learning journey today.</p>
</div>
<form class="p-8 space-y-4">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Role Selector -->
<div class="space-y-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">I am joining as a</label>
<div class="grid grid-cols-2 gap-3">
<label class="relative flex items-center justify-center p-3 border-2 border-primary bg-primary/5 rounded-lg cursor-pointer group">
<input checked="" class="hidden" name="role" type="radio" value="student"/>
<span class="text-primary font-semibold text-sm">Student</span>
</label>
<label class="relative flex items-center justify-center p-3 border-2 border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 rounded-lg cursor-pointer group hover:border-slate-200">
<input class="hidden" name="role" type="radio" value="instructor"/>
<span class="text-slate-600 dark:text-slate-400 font-semibold text-sm">Instructor</span>
</label>
</div>
</div>
<!-- Password Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<!-- Password -->
<div class="space-y-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Confirm</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock_clock</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-2 pt-2">
<input class="mt-1 rounded border-slate-300 text-primary focus:ring-primary" id="terms" type="checkbox"/>
<label class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed" for="terms">
                    By creating an account, I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3.5 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 mt-4" type="submit">
                Register Account
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<!-- Login Link -->
<div class="text-center pt-4">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline flex items-center justify-center gap-1 inline-flex" href="#">
                        Back to Login
                    </a>
</p>
</div>
</form>
<!-- Optional Illustration/Pattern Area -->
<div class="relative h-24 w-full bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 opacity-10 pointer-events-none" data-alt="Subtle geometric dot pattern background" style="background-image: radial-gradient(#5048e5 1px, transparent 1px); background-size: 20px 20px;"></div>
<p class="relative z-10 text-[10px] uppercase tracking-[0.2em] font-bold text-slate-400">EduCore Excellence</p>
</div>
</div>
</body></html>
