<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduCore LMS - Email Template Editor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5048e5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header -->
<div class="flex items-center bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 sticky top-0 z-10">
<button class="text-slate-600 dark:text-slate-400 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="ml-2">
<h1 class="text-lg font-bold leading-tight tracking-tight">Email Templates</h1>
<p class="text-xs text-slate-500 dark:text-slate-400">System Settings / Communications</p>
</div>
</div>
<!-- Template Selector -->
<div class="p-4">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Select Template to Edit</label>
<div class="relative">
<select class="custom-select w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option selected="" value="enrollment">New Course Enrollment</option>
<option value="due_reminder">Assignment Due Reminder</option>
<option value="grade_published">Grade Published</option>
<option value="welcome">New Student Welcome</option>
<option value="password_reset">Password Reset Request</option>
</select>
</div>
</div>
<!-- Main Editor Section -->
<main class="flex-1 px-4 pb-24 space-y-6">
<!-- Subject Line -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Email Subject</label>
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="Enter subject line..." type="text" value="Welcome to {{course_name}}!"/>
</div>
<!-- Variables Sidebar/Section -->
<div class="bg-primary/5 dark:bg-primary/10 border border-primary/20 rounded-xl p-4">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-sm">variables</span>
<h3 class="text-sm font-bold text-primary uppercase tracking-wider">Available Placeholders</h3>
</div>
<div class="flex flex-wrap gap-2">
<button class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded text-xs font-mono text-slate-600 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors">
                        {{student_name}}
                    </button>
<button class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded text-xs font-mono text-slate-600 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors">
                        {{course_name}}
                    </button>
<button class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded text-xs font-mono text-slate-600 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors">
                        {{instructor_name}}
                    </button>
<button class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded text-xs font-mono text-slate-600 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors">
                        {{login_url}}
                    </button>
<button class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded text-xs font-mono text-slate-600 dark:text-slate-400 hover:border-primary hover:text-primary transition-colors">
                        {{due_date}}
                    </button>
</div>
<p class="mt-3 text-[10px] text-slate-500 dark:text-slate-400 italic">Tap a tag to copy or insert it into the editor below.</p>
</div>
<!-- Body Editor Area -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Email Body Content</label>
<div class="rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 overflow-hidden flex flex-col">
<!-- Toolbar -->
<div class="flex items-center gap-1 p-2 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 overflow-x-auto">
<button class="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-xl">format_bold</span>
</button>
<button class="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-xl">format_italic</span>
</button>
<button class="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded text-slate-600 dark:text-slate-400 border-r border-slate-300 dark:border-slate-700 pr-3">
<span class="material-symbols-outlined text-xl">link</span>
</button>
<button class="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded text-slate-600 dark:text-slate-400 pl-2">
<span class="material-symbols-outlined text-xl">format_list_bulleted</span>
</button>
<button class="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-xl">format_align_left</span>
</button>
<button class="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-xl">image</span>
</button>
</div>
<!-- Text Area -->
<textarea class="w-full border-none bg-transparent p-4 text-sm focus:ring-0 resize-none leading-relaxed text-slate-800 dark:text-slate-200" rows="12">Hi {{student_name}},

Congratulations! You have been successfully enrolled in the course: {{course_name}}.

We are excited to have you on board. You can start your learning journey immediately by clicking the link below:

{{login_url}}

If you have any questions, feel free to reach out to your instructor, {{instructor_name}}.

Best regards,
The EduCore Learning Team</textarea>
</div>
</div>
<!-- Footer Actions -->
<div class="flex flex-col gap-3">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-xl">save</span>
                    Save Template
                </button>
<button class="w-full bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 font-semibold py-4 rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-xl">mail</span>
                    Send Test Email
                </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<div class="fixed bottom-0 left-0 right-0 flex gap-2 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 pb-3 pt-2 safe-area-inset-bottom">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500 dark:text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">school</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Courses</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500 dark:text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">group</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Users</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mail</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Templates</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500 dark:text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">settings</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Settings</p>
</a>
</div>
</div>
</body></html>
