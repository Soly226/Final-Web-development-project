<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduCore LMS - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#5048e5",
                "background-light": "#f6f6f8",
                "background-dark": "#121121",
              },
              fontFamily: {
                "display": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-white dark:bg-slate-900 rounded-xl shadow-xl overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Logo/Header Area -->
<div class="p-8 pb-0 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 mb-4">
<span class="material-symbols-outlined text-primary text-3xl">school</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-2xl font-bold leading-tight tracking-tight font-display">EduCore LMS</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Empowering the next generation of learners</p>
</div>
<!-- Login Form -->
<div class="p-8">
<h1 class="text-slate-900 dark:text-slate-100 text-xl font-semibold mb-1">Welcome Back</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Please enter your details to sign in</p>
<form class="space-y-4">
<!-- Email Field -->
<div>
<label class="block text-slate-700 dark:text-slate-300 text-sm font-medium mb-1.5" for="email">
                        Email Address
                    </label>
<div class="relative">
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-1.5">
<label class="block text-slate-700 dark:text-slate-300 text-sm font-medium" for="password">
                            Password
                        </label>
<a class="text-primary text-xs font-semibold hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none pr-10" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary/20" id="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-slate-600 dark:text-slate-400" for="remember-me">
                        Stay signed in for 30 days
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-lg shadow-primary/20 mt-2" type="submit">
                    Sign In
                </button>
</form>
<!-- Social Login Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-slate-900 px-2 text-slate-500">Or continue with</span>
</div>
</div>
<!-- Social Login Buttons -->
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 px-4 py-2 border border-slate-200 dark:border-slate-800 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google colorful logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-ZxrZ3_RbI0V0CKRR4knJqzDMT7qeb2tNZg5-DbIla4Hgnr74Lg2pdg_TkQv6igfVS427ZKoKs989fDG0O_BobsVXwLpHe_QzQPT0XxxqV55achX8eEe6XvWc8bQ-NcPeKLr1iYMgVBNVp4bB_qp96NRqFnJLsXxIB4uGIKllGO3hMItIwwPCjhRhN3wOVlumPygPJy8PKS57PO06TjSz7vlie9n23aDj9N3x2WJ3FKeaioP5QD8Gu3mY3ppXFKgJeUzl9KNZYvw"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Google</span>
</button>
<button class="flex items-center justify-center gap-2 px-4 py-2 border border-slate-200 dark:border-slate-800 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<img alt="LinkedIn Logo" class="w-5 h-5" data-alt="LinkedIn blue logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCP7RCUL_Gbziw2fdgZ5OjuVO7CPfh642uaJcKTd2SnF2DlVqjuOtE76vQbek9PAfnLgTkUdJVdnlT--54IrgKIm0WLLZAIEBqtzsdAqjZ7O1OPTQtqa2yKe1NyBPjG0M0gtDvUx0NjriUZ4YYzcPO4CP55INKWGW8QsLDtpWmnn4H4SXIy9F22256sTfH5jZriyYsYzT2GT8K-S0MKTeDqQr57-lZc5MYb3UmLGWgBvaD0bxiyyIvZ1zHyXHjZjnz7F9H1Pj72z_4"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">LinkedIn</span>
</button>
</div>
</div>
<!-- Footer -->
<div class="p-6 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 text-center">
<p class="text-sm text-slate-600 dark:text-slate-400">
                Don't have an account yet? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Create Account</a>
</p>
</div>
</div>
</body></html>
