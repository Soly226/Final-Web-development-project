<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5048e5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            appearance: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col max-w-md mx-auto bg-white dark:bg-slate-900 shadow-xl overflow-x-hidden">
<div class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md z-10">
<div class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Create Course</h2>
</div>
<div class="flex w-full flex-row items-center justify-center gap-3 py-6">
<div class="h-2 w-12 rounded-full bg-primary/20">
<div class="h-full w-full bg-primary rounded-full"></div>
</div>
<div class="h-2 w-12 rounded-full bg-primary/20">
<div class="h-full w-2/3 bg-primary rounded-full"></div>
</div>
</div>
<div class="px-6">
<div class="mb-6">
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-bold leading-tight">Settings &amp; Schedule</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Finalize your course logistics and visibility.</p>
</div>
<div class="space-y-6">
<section>
<h4 class="text-slate-900 dark:text-slate-100 text-sm font-semibold uppercase tracking-wider mb-4">General Details</h4>
<div class="flex flex-col gap-4">
<label class="flex flex-col">
<span class="text-slate-700 dark:text-slate-300 text-sm font-medium pb-2">Academic Semester</span>
<select class="w-full rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 h-12 px-4 focus:ring-2 focus:ring-primary focus:border-primary transition-all">
<option value="spring-2026">Spring 2026</option>
<option value="fall-2025">Fall 2025</option>
<option value="summer-2025">Summer 2025</option>
<option value="winter-2025">Winter 2025</option>
</select>
</label>
<label class="flex flex-col">
<span class="text-slate-700 dark:text-slate-300 text-sm font-medium pb-2">Enrollment Limit</span>
<div class="relative">
<input class="w-full rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 h-12 px-4 focus:ring-2 focus:ring-primary focus:border-primary transition-all" placeholder="e.g. 50" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">Students</span>
</div>
</label>
</div>
</section>
<section>
<h4 class="text-slate-900 dark:text-slate-100 text-sm font-semibold uppercase tracking-wider mb-4">Class Schedule</h4>
<div class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 space-y-4">
<div class="flex flex-wrap gap-2">
<button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-primary text-white">Mon</button>
<button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300">Tue</button>
<button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-primary text-white">Wed</button>
<button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300">Thu</button>
<button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-primary text-white">Fri</button>
<button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300">Sat</button>
</div>
<div class="grid grid-cols-2 gap-3">
<label class="flex flex-col">
<span class="text-slate-500 text-[10px] font-bold uppercase mb-1">Start Time</span>
<input class="rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:ring-primary focus:border-primary" type="time" value="09:00"/>
</label>
<label class="flex flex-col">
<span class="text-slate-500 text-[10px] font-bold uppercase mb-1">End Time</span>
<input class="rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:ring-primary focus:border-primary" type="time" value="10:30"/>
</label>
</div>
</div>
</section>
<section class="pb-32">
<h4 class="text-slate-900 dark:text-slate-100 text-sm font-semibold uppercase tracking-wider mb-4">Visibility</h4>
<label class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors cursor-pointer">
<input class="size-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox"/>
<div class="flex flex-col">
<span class="text-slate-900 dark:text-slate-100 text-sm font-medium">Make course public</span>
<span class="text-slate-500 dark:text-slate-400 text-xs">Allow anyone on the platform to browse and enroll.</span>
</div>
</label>
</section>
</div>
</div>
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 flex gap-3">
<button class="flex-1 h-12 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                Back
            </button>
<button class="flex-[2] h-12 rounded-xl bg-primary text-white font-semibold text-sm hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                Create Course
                <span class="material-symbols-outlined text-[18px]">auto_awesome</span>
</button>
</div>
</div>
</body></html>
